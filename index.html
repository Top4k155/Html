<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f7f9"><title>Личный чат</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root{--bg:#f6f7f9;--white:#fff;--ink:#17212b;--muted:#81909e;--line:#e8edf1;--blue:#3390ec;--green:#e7ffdb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.login{max-width:430px;margin:12vh auto;padding:30px;background:white;border:1px solid var(--line);border-radius:18px}.brand{font-size:20px;font-weight:750;display:flex;align-items:center;gap:10px}.logo{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font-weight:800}.login h1{font-size:26px;margin:25px 0 6px}.muted{color:var(--muted)}.btn{min-height:44px;border:0;border-radius:10px;padding:10px 16px;background:#edf3f8;color:var(--ink);font-weight:650}.primary{background:var(--blue);color:white}.login .btn{width:100%;margin-top:20px}.error{color:#c43d4b;font-size:14px;margin-top:12px}.app{height:100dvh;max-width:1050px;margin:auto;display:flex;flex-direction:column;background:white;border-left:1px solid var(--line);border-right:1px solid var(--line)}.header{height:68px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px}.avatar{height:42px;width:42px;border-radius:50%;display:grid;place-items:center;background:#e4f2ff;color:#1674c7;font-weight:750;font-size:18px}.headcopy{flex:1;min-width:0}.headcopy strong{display:block}.headcopy small{color:var(--muted)}.head-actions{display:flex;align-items:center;gap:12px}.head-actions img{width:34px;height:34px;border-radius:50%}.feed{flex:1;overflow:auto;padding:22px max(18px,calc((100% - 720px)/2));background-color:#e9eff2;background-image:radial-gradient(#d3dfe4 0.7px,transparent 0.7px);background-size:14px 14px}.day{text-align:center;margin:4px auto 18px;width:max-content;border-radius:20px;background:#ffffffcc;color:#60717c;padding:5px 12px;font-size:12px}.msg{max-width:min(78%,560px);width:max-content;margin:8px 0;padding:9px 12px 6px;border-radius:13px;background:white;box-shadow:0 1px 2px #15203018;overflow-wrap:anywhere}.msg.mine{margin-left:auto;background:var(--green);border-bottom-right-radius:4px}.msg.other{border-bottom-left-radius:4px}.sender{font-size:13px;font-weight:700;color:#2783c5;margin-bottom:3px}.body{white-space:pre-wrap}.time{text-align:right;color:#80908c;font-size:11px;margin:3px 0 0 14px}.empty{text-align:center;color:#677681;padding:28px 16px;background:#ffffffcf;border-radius:12px;margin:30px auto;max-width:350px}.compose{flex:none;border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:flex-end;background:#fff}.compose input{flex:1;min-width:0;border:0;outline:0;background:#f3f5f7;border-radius:20px;padding:12px 16px;min-height:46px}.send{width:46px;height:46px;border-radius:50%;padding:0;font-size:20px}.foot{font-size:12px;color:var(--muted);padding:0 18px 7px}.hidden{display:none!important}
@media(max-width:600px){.login{margin:8vh 14px;padding:23px}.header{height:62px;padding:0 13px}.head-actions .btn{padding:8px 11px}.feed{padding:16px 12px}.msg{max-width:88%}.compose{padding:10px}.foot{padding:0 12px 6px}}
</style>
<style>
/* Адаптивность встроена, чтобы Pages не зависел от отдельного CSS-файла. */
html,body{width:100%;height:100%;min-height:100%;margin:0;overflow:hidden}
.app{width:100%;max-width:none;height:100vh;height:100dvh;margin:0;border:0;border-radius:0;box-shadow:none}
.feed{padding:22px clamp(14px,2vw,28px)}
.header{padding-left:clamp(12px,3vw,28px);padding-right:clamp(12px,3vw,28px)}
.compose{padding-left:clamp(10px,2vw,22px);padding-right:clamp(10px,2vw,22px)}
@media(max-width:600px){
 .app{height:100vh;height:100dvh;min-height:0}
 .header{height:60px;min-height:60px;padding:0 12px;gap:10px}
 .avatar{width:38px;height:38px;flex:none}
 .headcopy strong{font-size:16px}.headcopy small{font-size:13px}
 .head-actions{gap:8px}.head-actions .btn{min-height:42px;padding:8px 12px}
 .feed{padding:14px 10px;overscroll-behavior:contain}
 .msg{max-width:88%;font-size:16px;padding:9px 11px 6px}
 .compose{padding:9px 10px calc(9px + env(safe-area-inset-bottom));gap:8px}
 .compose input{font-size:16px;min-height:46px;padding:11px 15px}
 .send{width:46px;height:46px;flex:none}
 .foot{font-size:12px;padding:5px 12px}
}
</style>
<style>
.settings-panel{position:fixed;inset:0;z-index:20;background:#17212b66;display:grid;place-items:center;padding:16px}.settings-card{width:min(520px,100%);background:#fff;border-radius:16px;padding:22px;box-shadow:0 18px 60px #0003}.settings-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.settings-top h2{font-size:22px;margin:0}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-top:1px solid var(--line)}.setting-row strong,.setting-row small{display:block}.setting-row small{font-size:13px;color:var(--muted);margin-top:3px}.setting-select{min-height:44px;max-width:190px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:white;color:var(--ink);font:inherit}@media(max-width:600px){.settings-card{padding:18px}.setting-row{align-items:flex-start;flex-direction:column}.setting-select{max-width:none;width:100%}}
.pinbar{display:none;flex:none;background:#fff7da;border-bottom:1px solid #eadcae;padding:10px clamp(12px,2vw,24px);align-items:flex-start;gap:10px}.pinbar.visible{display:flex}.pinmark{color:#b57b00;font-size:18px;line-height:1.3}.pincontent{min-width:0;flex:1}.pinlabel{font-size:12px;font-weight:700;color:#896300}.pintext{white-space:pre-wrap;overflow-wrap:anywhere}.pinclose{border:0;background:transparent;color:#756b50;font-size:20px;min-width:40px;min-height:40px;border-radius:8px}.msg{touch-action:pan-y;user-select:text;-webkit-user-select:text}.msg-menu{position:fixed;z-index:30;min-width:180px;padding:6px;background:white;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px #17212b33}.msg-menu button{display:block;width:100%;min-height:44px;text-align:left;border:0;border-radius:8px;background:white;padding:9px 12px;color:var(--ink);font:inherit}.msg-menu button:hover{background:#f1f5f8}

.msg{animation:msg-in .24s cubic-bezier(.2,.8,.2,1) both;transform-origin:bottom left}.msg.mine{transform-origin:bottom right}@keyframes msg-in{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.msg-menu:not(.hidden){animation:menu-in .16s ease-out both;transform-origin:top left}@keyframes menu-in{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.settings-panel:not(.hidden){animation:overlay-in .18s ease-out both}.settings-card{animation:settings-in .22s cubic-bezier(.2,.8,.2,1) both}.settings-closing{animation:overlay-out .18s ease-in both}.settings-closing .settings-card{animation:settings-out .16s ease-in both}
@keyframes overlay-in{from{opacity:0}to{opacity:1}}@keyframes overlay-out{to{opacity:0}}@keyframes settings-in{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes settings-out{to{opacity:0;transform:translateY(8px) scale(.98)}}
.msg-removing{animation:msg-break .48s ease-in forwards!important;pointer-events:none}@keyframes msg-break{to{opacity:0;filter:blur(2px);transform:scale(.86) rotate(-3deg)}}.msg-piece{position:fixed;z-index:100;width:7px;height:7px;border-radius:2px;background:#3390ec;pointer-events:none;animation:piece-fly .68s cubic-bezier(.2,.7,.4,1) forwards}@keyframes piece-fly{0%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.25)}}
@media(prefers-reduced-motion:reduce){.msg,.msg-menu:not(.hidden),.settings-panel:not(.hidden),.settings-card,.msg-removing,.msg-piece{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style></head><body>
<div id="login" class="login"><div class="brand"><span class="logo">Ч</span> Мой чат</div><h1>Войти в чат</h1><p class="muted">Войдите через Google, чтобы читать и отправлять сообщения.</p><button id="loginBtn" class="btn primary">Продолжить с Google</button><div id="loginError" class="error"></div><p class="muted" style="font-size:13px;margin:18px 0 0">Доступ имеют только адреса, указанные владельцем в настройках приложения.</p></div>
<div id="app" class="app hidden"><header class="header"><div class="avatar">Ч</div><div class="headcopy"><strong>Общий чат</strong><small id="status">Подключение…</small></div><div class="head-actions"><img id="photo" class="hidden" alt=""><button id="settingsBtn" class="btn" type="button">Настройки</button><button id="logout" class="btn">Выйти</button></div></header><div id="pinbar" class="pinbar"><span class="pinmark">⌖</span><div class="pincontent"><div class="pinlabel">Закреплённое сообщение</div><div id="pintext" class="pintext"></div></div><button id="unpin" class="pinclose hidden" type="button" aria-label="Открепить">×</button></div><main id="feed" class="feed"><div class="day">Сообщения чата</div><div id="messages"></div></main><div class="foot">Сообщения видны всем участникам этого чата</div><form id="form" class="compose"><input id="text" maxlength="2000" autocomplete="off" placeholder="Сообщение…"><button class="btn primary send" aria-label="Отправить">➤</button></form><div id="chatError" class="error" style="padding:0 14px 8px"></div></div>
<div id="settingsPanel" class="settings-panel hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><div class="settings-card"><div class="settings-top"><h2 id="settingsTitle">Настройки</h2><button id="settingsClose" class="btn" type="button" aria-label="Закрыть настройки">Закрыть</button></div><label class="setting-row" for="clockMode"><span><strong>Формат времени</strong><small>Как показывать время отправки сообщений</small></span><select id="clockMode" class="setting-select"><option value="auto">Авто</option><option value="12">12 часов (AM/PM)</option><option value="24">24 часа</option></select></label></div></div>
<div id="messageMenu" class="msg-menu hidden"></div>
<script type="module" src="app.js"></script></body></html>
